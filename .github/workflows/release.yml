name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Type check
        run: bun run typecheck
      
      - name: Lint
        run: bun run lint
      
      - name: Run unit tests
        run: bun test tests/config.test.ts tests/output.test.ts tests/client.test.ts tests/errors.test.ts
      
      - name: Run integration tests
        run: bun test --timeout 60000 tests/integration/

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build Linux x64
        run: bun build --compile --minify --target=bun-linux-x64 src/index.ts --outfile dist/mcpx-linux-x64

      - name: Build Linux ARM64
        run: bun build --compile --minify --target=bun-linux-arm64 src/index.ts --outfile dist/mcpx-linux-arm64

      - name: Build macOS x64
        run: bun build --compile --minify --target=bun-darwin-x64 src/index.ts --outfile dist/mcpx-darwin-x64

      - name: Build macOS ARM64
        run: bun build --compile --minify --target=bun-darwin-arm64 src/index.ts --outfile dist/mcpx-darwin-arm64
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/
      
      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/mcpx-linux-x64
            dist/mcpx-linux-arm64
            dist/mcpx-darwin-x64
            dist/mcpx-darwin-arm64
            dist/checksums.txt

  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh workflow run update-formula.yml \
            --repo cs50victor/homebrew-tap \
            -f formula=mcpx \
            -f tag="${GITHUB_REF#refs/tags/}" \
            -f repository=cs50victor/mcpx \
            -f description="Lightweight CLI for interacting with MCP (Model Context Protocol) servers" \
            -f artifact_url="https://github.com/cs50victor/mcpx/releases/download/v#{version}/mcpx-{target}"
